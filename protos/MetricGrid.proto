#VRML_SIM R2025a utf8
# One-metre floor grid. Thin visual lines have no collision geometry.
# template language: javascript

PROTO MetricGrid [
  field SFFloat size 10
  field SFFloat spacing 1
]
{
  %< const size = fields.size.value; const step = fields.spacing.value; >%
  Group {
    children [
      %< for (let p = -size / 2; p <= size / 2 + 1e-6; p += step) { >%
      Pose {
        translation %<= p >% 0 0.002
        children [
          Shape {
            appearance DEF GRID_PAINT PBRAppearance {
              baseColor 0.74 0.78 0.82
              metalness 0
              roughness 1
            }
            geometry Box { size 0.008 %<= size >% 0.002 }
          }
        ]
      }
      Pose {
        translation 0 %<= p >% 0.002
        children [
          Shape {
            appearance USE GRID_PAINT
            geometry Box { size %<= size >% 0.008 0.002 }
          }
        ]
      }
      %< } >%
    ]
  }
}
